name: Temporary ITS Chapter 8 extraction
on:
  push:
    branches:
      - internal/its-chapter8-extract
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract readable lecture text
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdfinfo 'notes/ITS/Chapter-8.pdf' | head -25
          echo '==== BEGIN CHAPTER 8 ===='
          pdftotext -layout 'notes/ITS/Chapter-8.pdf' - | head -c 190000
          echo '==== END CHAPTER 8 ===='
